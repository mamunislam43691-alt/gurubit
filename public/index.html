    <!-- Theme Manager -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                document.documentElement.classList.add('light');
            } else {
                document.documentElement.classList.remove('light');
            }
        })();
        
        window.GURUBIT_THEME = {
            current: 'dark',
            init() {
                const saved = localStorage.getItem('theme') || 'dark';
                this.set(saved);
            },
            set(theme) {
                this.current = theme;
                if (theme === 'light') {
                    document.documentElement.classList.add('light');
                } else {
                    document.documentElement.classList.remove('light');
                }
                localStorage.setItem('theme', theme);
                this.updateButtons();
            },
            toggle() {
                const target = this.current === 'dark' ? 'light' : 'dark';
                this.set(target);
            },
            updateButtons() {
                document.querySelectorAll('.theme-toggle-btn').forEach(btn => {
                    const isLight = this.current === 'light';
                    btn.innerHTML = isLight 
                        ? '<i class="fas fa-moon"></i>' 
                        : '<i class="fas fa-sun"></i>';
                    btn.title = isLight ? 'Switch to Dark Mode' : 'Switch to Light Mode';
                });
            }
        };
        // Initialize immediately
        window.GURUBIT_THEME.init();
    </script>

<body class="min-h-screen">
    <!-- Loader -->
    <div id="app-loader">
        <img src="/assets/logo.svg" alt="GURUBIT" class="w-16 h-16 logo-glow animate-float">
        <div class="spinner"></div>
        <p class="stat-label">Initializing GURUBIT...</p>
    </div>

    <!-- App root -->
    <div id="app" style="opacity:0; transition: opacity 0.3s ease;"></div>
    
    <!-- Main application script -->
    <script type="module">
        // Hide loader as soon as app.js starts executing — don't wait for data
        function hideLoader() {
            const loader = document.getElementById('app-loader');
            const app = document.getElementById('app');
            if (loader && !loader._hidden) {
                loader._hidden = true;
                loader.classList.add('fade-out');
                if (app) app.style.opacity = '1';
                setTimeout(() => { loader.remove(); }, 400);
            }
        }

        import('/js/app.js?v=5')
            .then((module) => {
                // Hide loader immediately when JS is loaded — before data fetches
                hideLoader();
                return module.GURUBIT_APP_READY || Promise.resolve();
            })
            .catch((err) => {
                console.error('Failed to load application:', err);
                hideLoader();
            });

        // Fallback: force hide loader after 1.5s no matter what
        setTimeout(hideLoader, 1500);
    </script>
    
    <!-- Performance Optimization Module -->
    <script src="/js/api-cache.js" defer></script>
    <script src="/js/perf-opt.js" defer></script>
</body>
</html>
